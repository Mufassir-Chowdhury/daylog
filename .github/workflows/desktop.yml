# Builds the Windows installer (Tauri, src-tauri/) on every push to main and
# publishes it as the repository's latest release, so it can be downloaded
# straight from GitHub:
#   https://github.com/<owner>/<repo>/releases/latest/download/daylog-setup.exe
# Each build is versioned 0.1.<run number> and gets its own release (tag
# desktop-v0.1.<run number>), which carries latest.yml: installed apps poll the
# latest release's copy to update themselves (src-tauri/src/updater.rs). The
# last Electron versions read the same file and update into this installer.
#
# Pull requests that touch the desktop app build the installer too, without
# publishing anything.
#
# Once SignPath is set up (the SIGNPATH_ORGANIZATION_ID variable and the
# SIGNPATH_API_TOKEN secret), the installer is code-signed by SignPath Foundation
# before it's published; until then the steps are skipped and it ships unsigned.
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'static/**'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('desktop-pr-{0}', github.ref) || 'desktop-release' }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # Generous: release signing can wait up to an hour for approval on signpath.io.
    timeout-minutes: 120
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        # Test binaries need the Common Controls v6 manifest the app gets from
        # tauri-build, or Windows can't load them (STATUS_ENTRYPOINT_NOT_FOUND).
        run: |
          export RUSTFLAGS="-C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:$(cygpath -w "$PWD/windows/test.manifest")"
          cargo test --locked --lib

      - name: Build the installer
        # bash, not the default PowerShell, which mangles the JSON argument.
        shell: bash
        run: |
          npx tauri build --ci --config "{\"version\":\"$VERSION\"}"
          mkdir -p desktop/dist
          cp "src-tauri/target/release/bundle/nsis/daylog_${VERSION}_x64-setup.exe" desktop/dist/daylog-setup.exe
          node desktop/write-update-info.mjs desktop/dist/daylog-setup.exe "$VERSION" desktop/dist/latest.yml

      - name: Keep the pull request's installer
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daylog-setup
          path: desktop/dist/
          if-no-files-found: error

      - name: Test updating from the Electron app
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        shell: pwsh
        run: ./desktop/test-migration.ps1 desktop/dist/daylog-setup.exe

      - name: Upload the unsigned installer for signing
        id: unsigned
        if: github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: daylog-setup-unsigned
          path: desktop/dist/daylog-setup.exe
          if-no-files-found: error

      - name: Sign the installer with SignPath
        if: github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: daylog
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for someone to approve it on signpath.io.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/dist/signed

      - name: Swap in the signed installer
        if: github.event_name != 'pull_request' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: node desktop/refresh-update-info.mjs desktop/dist/signed/daylog-setup.exe desktop/dist

      - name: Publish the release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: daylog for Windows ${{ env.VERSION }}
          make_latest: true
          body: |
            Latest Windows build of the daylog desktop app (${{ env.VERSION }}), from ${{ github.sha }}.

            Download **daylog-setup.exe** and run it. ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || 'The installer isn''t code-signed.' }}
            Windows SmartScreen may warn the first time — choose **More info → Run anyway**.
            Installed copies update themselves from this release.
          files: |
            desktop/dist/daylog-setup.exe
            desktop/dist/latest.yml
