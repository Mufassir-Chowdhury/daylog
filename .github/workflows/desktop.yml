# Builds the Windows installer on every push to main and publishes it as the
# repository's latest release, so it can be downloaded straight from GitHub:
#   https://github.com/<owner>/<repo>/releases/latest/download/daylog-setup.exe
# Each build is versioned 0.1.<run number> and gets its own release (tag
# desktop-v0.1.<run number>), which carries latest.yml: installed apps poll the
# latest release's copy to update themselves (desktop/updater.cjs).
#
# During the move to Tauri (docs/tauri-migration.md) each release also carries
# the Tauri preview installer, daylog-tauri-setup.exe, and latest-tauri.yml,
# which installed previews update from (src-tauri/src/updater.rs). Pull requests that touch
# the desktop app build it too, without publishing anything.
#
# Once SignPath is set up (the SIGNPATH_ORGANIZATION_ID variable and the
# SIGNPATH_API_TOKEN secret), the installer is code-signed by SignPath Foundation
# before it's published; until then the steps are skipped and it ships unsigned.
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'static/**'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('desktop-pr-{0}', github.ref) || 'desktop-release' }}
  cancel-in-progress: true

jobs:
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the Tauri installer
        # bash, not the default PowerShell, which mangles the JSON argument.
        shell: bash
        run: |
          npx tauri build --ci --config '{"version":"0.1.${{ github.run_number }}"}'
          mkdir -p tauri-dist
          cp src-tauri/target/release/bundle/nsis/daylog_0.1.${{ github.run_number }}_x64-setup.exe tauri-dist/daylog-tauri-setup.exe
          node desktop/write-update-info.mjs tauri-dist/daylog-tauri-setup.exe 0.1.${{ github.run_number }} tauri-dist/latest-tauri.yml

      - uses: actions/upload-artifact@v4
        with:
          name: daylog-tauri-setup
          path: tauri-dist/
          if-no-files-found: error

  windows:
    needs: tauri
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app and the installer
        # bash, not the default PowerShell, which mangles the --config.* argument.
        shell: bash
        run: |
          npm run desktop:build
          npx electron-builder --win --publish never --config.extraMetadata.version=0.1.${{ github.run_number }}

      - name: Upload the unsigned installer for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: daylog-setup-unsigned
          path: desktop/dist/daylog-setup.exe
          if-no-files-found: error

      - name: Sign the installer with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: daylog
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for someone to approve it on signpath.io.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/dist/signed

      - name: Swap in the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: node desktop/refresh-update-info.mjs desktop/dist/signed/daylog-setup.exe desktop/dist

      - uses: actions/download-artifact@v4
        with:
          name: daylog-tauri-setup
          path: desktop/dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: daylog for Windows 0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Latest Windows build of the daylog desktop app (0.1.${{ github.run_number }}), from ${{ github.sha }}.

            Download **daylog-setup.exe** and run it. ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || 'The installer isn''t code-signed.' }}
            Windows SmartScreen may warn the first time — choose **More info → Run anyway**.
            Installed copies update themselves from this release.

            **Preview:** daylog-tauri-setup.exe is the same app on Tauri — a much smaller download, updating itself from latest-tauri.yml. Quit the regular app before trying it.
          files: |
            desktop/dist/daylog-setup.exe
            desktop/dist/latest.yml
            desktop/dist/daylog-tauri-setup.exe
            desktop/dist/latest-tauri.yml
